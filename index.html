<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gooooood Search</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            padding: 20px;
        }

        .top-bar {
            display: flex; gap: 15px; margin-bottom: 20px;
            background: #f8f9fa; padding: 10px 20px; border-radius: 20px;
        }

        .logo {
            font-size: clamp(50px, 10vw, 80px);
            font-weight: bold; margin-bottom: 20px;
            cursor: pointer; user-select: none;
        }
        .g { color: #4285F4; } .o1 { color: #EA4335; } .o2 { color: #FBBC05; } .d { color: #34A853; }

        .search-container { width: 100%; max-width: 700px; }

        /* Настройка, чтобы результаты были встроены (не всплывали) */
        .gsc-control-cse { border: none !important; padding: 0 !important; }
        .gsc-results-wrapper-overlay { display: none !important; } /* Убиваем оверлей (всплывалку) */
        .gsc-results-wrapper-visible { position: static !important; } /* Фиксируем результаты на странице */
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="lang" onchange="applyLang()">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
        <label><input type="checkbox" id="rknsafe"> <span id="txt-safe">Список РКН</span></label>
    </div>

    <div class="logo" id="logo" onclick="location.reload()">
        <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="d">d</span>
    </div>

    <div class="search-container">
        <script async src="https://cse.google.com/cse.js?cx=2358a1ff7eac84a06"></script>
        <div class="gcse-search" data-autoSearchOnLoad="false"></div>
    </div>

    <script>
        const ui = {
            ru: { safe: "Список РКН", ph: "Поиск в Gooooood..." },
            en: { safe: "Safe Search", ph: "Search in Gooooood..." }
        };

        function applyLang() {
            const l = document.getElementById('lang').value;
            document.getElementById('txt-safe').innerText = ui[l].safe;
            localStorage.setItem('gLang', l);
        }

        function growLogo() {
            const logo = document.getElementById('logo');
            const os = Math.floor(Math.random() * 5) + 6;
            let html = '<span class="g">G</span>';
            for(let i=0; i<os; i++) html += `<span class="${i%2===0?'o1':'o2'}">o</span>`;
            logo.innerHTML = html + '<span class="d">d</span>';
        }

        window.__gcse = {
            parsetags: 'onload',
            callback: function() {
                applyLang();
                const btn = document.querySelector('.gsc-search-button-v2');
                const inp = document.querySelector('input.gsc-input');

                const handleSearch = () => {
                    growLogo();
                    if(document.getElementById('rknsafe').checked) {
                        if(!inp.value.includes('site:')) inp.value += " site:wikipedia.org";
                    }
                };

                if(btn) btn.addEventListener('click', handleSearch);
                if(inp) inp.addEventListener('keypress', (e) => { if(e.key==='Enter') handleSearch(); });
            }
        };

        window.onload = () => {
            const saved = localStorage.getItem('gLang');
            if(saved) { document.getElementById('lang').value = saved; applyLang(); }
        };
    </script>
</body>
</html>
