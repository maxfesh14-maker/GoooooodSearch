<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gooooood Search</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; transition: 0.3s; }
        .logo { font-size: clamp(50px, 10vw, 80px); font-weight: bold; margin-top: 30px; margin-bottom: 10px; cursor: pointer; }
        .g { color: #4285F4; } .o1 { color: #EA4335; } .o2 { color: #FBBC05; } .d { color: #34A853; }
        
        .container { width: 100%; max-width: 600px; text-align: center; }
        
        /* Панель настроек */
        .settings-panel { 
            display: flex; gap: 10px; justify-content: center; 
            margin-bottom: 20px; background: #f1f3f4; padding: 10px; border-radius: 15px;
        }

        select, label { font-size: 14px; color: #555; cursor: pointer; }

        /* Настройка встроенного поиска Google */
        .gcse-search { margin-top: 20px; }
        .gsc-control-cse { border: none !important; padding: 0 !important; }
    </style>
</head>
<body>

    <div class="settings-panel">
        <select id="lang-select" onchange="changeLanguage()">
            <option value="ru">Русский 🇷🇺</option>
            <option value="en">English 🇺🇸</option>
        </select>
        
        <label>
            <input type="checkbox" id="safe-mode"> 
            <span id="label-safe">РКН Список</span>
        </label>
    </div>

    <div class="logo" id="logo" onclick="location.reload()">
        <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="d">d</span>
    </div>

    <div class="container">
        <script async src="https://cse.google.com/cse.js?cx=2358a1ff7eac84a06"></script>
        <div class="gcse-search"></div>
    </div>

    <script>
        // СЛОВАРЬ ДЛЯ ПЕРЕВОДА
        const translations = {
            ru: {
                safe: "Список РКН",
                placeholder: "Поиск в Gooooood...",
                status: "Ищем ответы..."
            },
            en: {
                safe: "Safe Search",
                placeholder: "Search in Gooooood...",
                status: "Finding answers..."
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            
            // 1. Меняем текст интерфейса
            document.getElementById('label-safe').innerText = translations[lang].safe;
            
            // 2. Меняем язык для Google (пытаемся достучаться до его поля)
            const gInput = document.querySelector('input.gsc-input');
            if (gInput) {
                gInput.placeholder = translations[lang].placeholder;
            }
            
            // 3. Сохраняем выбор (чтобы не сбросился)
            localStorage.setItem('mySearchLang', lang);
        }

        // КРУТАЯ АНИМАЦИЯ "oooooooooo"
        function animateLogo() {
            const logo = document.getElementById('logo');
            const count = Math.floor(Math.random() * 8) + 6;
            let res = '<span class="g">G</span>';
            for (let i = 0; i < count; i++) {
                res += `<span class="${i % 2 === 0 ? 'o1' : 'o2'}">o</span>`;
            }
            logo.innerHTML = res + '<span class="d">d</span>';
        }

        // СЛЕЖКА ЗА ПОИСКОМ
        window.__gcse = {
            parsetags: 'onload',
            callback: function() {
                // Как только Google загрузился, применяем язык
                changeLanguage();
                
                const btn = document.querySelector('.gsc-search-button-v2');
                if (btn) {
                    btn.addEventListener('click', animateLogo);
                }
            }
        };

        // Загрузка настроек при старте
        window.onload = () => {
            const savedLang = localStorage.getItem('mySearchLang');
            if (savedLang) {
                document.getElementById('lang-select').value = savedLang;
            }
        };
    </script>
</body>
</html>
