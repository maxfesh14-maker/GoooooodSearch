<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gooooood Search</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            padding: 20px;
        }

        /* Панель управления */
        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #f1f3f4;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Логотип */
        .logo {
            font-size: clamp(50px, 12vw, 90px);
            font-weight: bold;
            margin: 30px 0;
            cursor: pointer;
            user-select: none;
        }
        .g { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .d { color: #34A853; }

        .search-area {
            width: 100%;
            max-width: 600px;
        }

        /* Стили для поиска Google */
        .gsc-control-cse { border: none !important; background: transparent !important; padding: 0 !important; }
        .gsc-input-box { border-radius: 24px !important; border: 1px solid #dfe1e5 !important; }
        .gsc-search-button-v2 { border-radius: 20px !important; background-color: #4285F4 !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="lang" onchange="applyLang()">
            <option value="ru">Русский 🇷🇺</option>
            <option value="en">English 🇺🇸</option>
        </select>
        <label>
            <input type="checkbox" id="rknsafe"> <span id="txt-safe">Список РКН</span>
        </label>
    </div>

    <div class="logo" id="logo" onclick="location.reload()">
        <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="d">d</span>
    </div>

    <div class="search-area">
        <script async src="https://cse.google.com/cse.js?cx=2358a1ff7eac84a06"></script>
        
        <div class="gcse-search"></div>
    </div>

    <script>
        const ui = {
            ru: { safe: "Список РКН", ph: "Поиск в Gooooood..." },
            en: { safe: "Safe Search", ph: "Search in Gooooood..." }
        };

        function applyLang() {
            const l = document.getElementById('lang').value;
            const label = document.getElementById('txt-safe');
            if (label) label.innerText = ui[l].safe;
            
            // Меняем плейсхолдер
            const input = document.querySelector('input.gsc-input');
            if(input) input.placeholder = ui[l].ph;
            
            localStorage.setItem('gLang', l);
        }

        function growLogo() {
            const logo = document.getElementById('logo');
            const count = Math.floor(Math.random() * 6) + 6;
            let html = '<span class="g">G</span>';
            for(let i=0; i<count; i++) {
                html += `<span class="${i%2===0?'o1':'o2'}">o</span>`;
            }
            logo.innerHTML = html + '<span class="d">d</span>';
        }

        window.__gcse = {
            parsetags: 'onload',
            callback: function() {
                applyLang();
                
                const btn = document.querySelector('.gsc-search-button-v2');
                const inp = document.querySelector('input.gsc-input');

                const startSearch = () => {
                    growLogo();
                    // Если галочка стоит, добавляем фильтр к запросу
                    if(document.getElementById('rknsafe').checked) {
                        if(inp && !inp.value.includes('site:')) {
                            inp.value += " site:wikipedia.org";
                        }
                    }
                };

                if(btn) btn.addEventListener('click', startSearch);
                if(inp) inp.addEventListener('keypress', (e) => { if(e.key==='Enter') startSearch(); });
            }
        };

        window.onload = () => {
            const saved = localStorage.getItem('gLang');
            if(saved) {
                document.getElementById('lang').value = saved;
                applyLang();
            }
        };
    </script>
</body>
</html>
